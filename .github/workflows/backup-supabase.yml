name: Backup Supabase

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/backup-supabase.yml
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      confirm_production_backup:
        description: Type BACKUP_PRODUCTION_READ_ONLY
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: supabase-production-backup
  cancel-in-progress: false

jobs:
  backup-and-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_PROD_PROJECT_REF: wxrqvcthrkabjllvqghq
      PROD_POOLER_HOST: aws-1-eu-central-1.pooler.supabase.com
      BACKUP_RETENTION_DAYS: "7"
      PGCONNECT_TIMEOUT: "15"

    steps:
      - name: Confirm read-only production operation
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRMATION: ${{ inputs.confirm_production_backup }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "BACKUP_PRODUCTION_READ_ONLY" ]; then
            echo "Explicit production backup confirmation is required."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install encryption client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gnupg jq

      - name: Create encrypted production dump
        id: backup
        env:
          PROD_PROJECT_REF: ${{ secrets.SUPABASE_PRODUCTION_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077

          if [ -z "${BACKUP_PASSPHRASE:-}" ]; then
            echo "BACKUP_ENCRYPTION_PASSPHRASE is required."
            exit 1
          fi

          if [ -z "${PROD_PROJECT_REF:-}" ]; then
            echo "SUPABASE_PRODUCTION_PROJECT_REF is required as a GitHub Actions secret."
            exit 1
          fi

          if [ "$PROD_PROJECT_REF" != "$EXPECTED_PROD_PROJECT_REF" ]; then
            echo "Production project reference does not match the approved project."
            exit 1
          fi

          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "SUPABASE_DB_PASSWORD is required as a GitHub Actions secret."
            exit 1
          fi

          DB_USER="postgres.${PROD_PROJECT_REF}"
          DATE_UTC="$(date -u +%F)"
          BACKUP_BASENAME="evo-prod-${DATE_UTC}-${GITHUB_RUN_ID}"
          DUMP_FILE="${BACKUP_BASENAME}.dump"
          ENCRYPTED_FILE="${DUMP_FILE}.gpg"

          docker run --rm \
            -e PGPASSWORD="$SUPABASE_DB_PASSWORD" \
            -e PGSSLMODE=require \
            postgres:17 \
            pg_dump \
              --host="$PROD_POOLER_HOST" \
              --port=5432 \
              --username="$DB_USER" \
              --dbname=postgres \
              --format=custom \
              --compress=9 \
              --no-owner \
              --no-privileges | \
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 3 \
              --symmetric --cipher-algo AES256 --compress-algo none \
              --output "$ENCRYPTED_FILE" 3<<< "$BACKUP_PASSPHRASE"

          docker run --rm \
            -e PGPASSWORD="$SUPABASE_DB_PASSWORD" \
            -e PGSSLMODE=require \
            postgres:17 \
            psql \
              --host="$PROD_POOLER_HOST" \
              --port=5432 \
              --username="$DB_USER" \
              --dbname=postgres \
              --no-psqlrc --tuples-only --no-align --quiet --command="
              select jsonb_build_object(
                'schemas', (select count(*) from pg_namespace where nspname in ('public','auth','storage','supabase_migrations')),
                'public_tables', (select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE'),
                'public_functions', (select count(*) from information_schema.routines where routine_schema='public'),
                'published_weeks', (select count(*) from public.published_weeks),
                'coach_sessions', (select count(*) from public.coach_sessions),
                'coach_messages', (select count(*) from public.coach_messages),
                'auth_users', (select count(*) from auth.users),
                'storage_buckets', (select count(*) from storage.buckets),
                'migration_rows', (select count(*) from supabase_migrations.schema_migrations)
              );" > source-control.json

          sha256sum "$ENCRYPTED_FILE" > "${ENCRYPTED_FILE}.sha256"

          printf '%s\n' \
            "backup=${BACKUP_BASENAME}" \
            "encryption=openpgp-symmetric-aes256-s2k" \
            "retention_days=${BACKUP_RETENTION_DAYS}" \
            "source_project_ref=${PROD_PROJECT_REF}" \
            "postgres_client=17" > backup-metadata.txt

          echo "dump_file=$DUMP_FILE" >> "$GITHUB_OUTPUT"
          echo "encrypted_file=$ENCRYPTED_FILE" >> "$GITHUB_OUTPUT"
          echo "artifact_name=supabase-production-${DATE_UTC}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Restore encrypted dump in isolated ephemeral Postgres
        env:
          DUMP_FILE: ${{ steps.backup.outputs.dump_file }}
          ENCRYPTED_FILE: ${{ steps.backup.outputs.encrypted_file }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          RESTORE_PASSWORD: restore-only-ephemeral
        run: |
          set -euo pipefail
          umask 077
          RESTORED_DUMP="restored-${DUMP_FILE}"

          gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 3 \
            --decrypt --output "$RESTORED_DUMP" "$ENCRYPTED_FILE" \
            3<<< "$BACKUP_PASSPHRASE"

          docker run --detach --rm \
            --name evo-supabase-restore \
            --publish 127.0.0.1:55432:5432 \
            --env POSTGRES_PASSWORD="$RESTORE_PASSWORD" \
            supabase/postgres:17.6.1.136 \
            postgres -c config_file=/etc/postgresql/postgresql.conf

          cleanup() {
            docker stop evo-supabase-restore >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if docker run --rm --network host \
              --env PGPASSWORD="$RESTORE_PASSWORD" \
              postgres:17 \
              pg_isready --host=127.0.0.1 --port=55432 --username=postgres --dbname=postgres >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Ephemeral restore database did not become ready."
              exit 1
            fi
            sleep 2
          done

          for role in anon authenticated service_role authenticator supabase_admin dashboard_user supabase_auth_admin supabase_storage_admin; do
            docker run --rm --network host \
              --env PGPASSWORD="$RESTORE_PASSWORD" \
              postgres:17 \
              psql --host=127.0.0.1 --port=55432 --username=postgres --dbname=postgres \
                --no-psqlrc --set=ON_ERROR_STOP=1 \
                --command="DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${role}') THEN EXECUTE 'CREATE ROLE ${role} NOLOGIN'; END IF; END \$\$;" >/dev/null
          done

          docker run --rm --network host \
            --env PGPASSWORD="$RESTORE_PASSWORD" \
            postgres:17 \
            createdb --host=127.0.0.1 --port=55432 --username=postgres --template=template0 evo_restore

          docker run --rm --network host \
            --env PGPASSWORD="$RESTORE_PASSWORD" \
            -v "$PWD:/work" \
            postgres:17 \
            pg_restore \
              --host=127.0.0.1 \
              --port=55432 \
              --username=postgres \
              --dbname=evo_restore \
              --exit-on-error \
              --no-owner \
              --no-privileges \
              "/work/${RESTORED_DUMP}"

          docker run --rm --network host \
            --env PGPASSWORD="$RESTORE_PASSWORD" \
            postgres:17 \
            psql --host=127.0.0.1 --port=55432 --username=postgres --dbname=evo_restore \
              --no-psqlrc --tuples-only --no-align --quiet --command="
                select jsonb_build_object(
                  'schemas', (select count(*) from pg_namespace where nspname in ('public','auth','storage','supabase_migrations')),
                  'public_tables', (select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE'),
                  'public_functions', (select count(*) from information_schema.routines where routine_schema='public'),
                  'published_weeks', (select count(*) from public.published_weeks),
                  'coach_sessions', (select count(*) from public.coach_sessions),
                  'coach_messages', (select count(*) from public.coach_messages),
                  'auth_users', (select count(*) from auth.users),
                  'storage_buckets', (select count(*) from storage.buckets),
                  'migration_rows', (select count(*) from supabase_migrations.schema_migrations)
                );" > restored-control.json

          jq --sort-keys . source-control.json > source-control.sorted.json
          jq --sort-keys . restored-control.json > restored-control.sorted.json
          if ! cmp --silent source-control.sorted.json restored-control.sorted.json; then
            echo "Restored control manifest does not match the source manifest."
            exit 1
          fi

          docker run --rm --network host \
            --env PGPASSWORD="$RESTORE_PASSWORD" \
            postgres:17 \
            psql --host=127.0.0.1 --port=55432 --username=postgres --dbname=evo_restore \
              --no-psqlrc --tuples-only --no-align --quiet --command="
                select case when
                  to_regclass('public.published_weeks') is not null
                  and to_regclass('public.coach_sessions') is not null
                  and to_regclass('public.coach_messages') is not null
                  and to_regprocedure('public.pe2_my_org()') is not null
                  and to_regprocedure('public.save_published_week_draft_v2(text,integer,text,jsonb,uuid,bigint,uuid,text,text,text,integer,jsonb,jsonb,timestamp with time zone)') is not null
                then 'ok' else 'missing' end;" | grep -qx ok

          printf '%s\n' "restore=pass" "control_manifest=match" >> backup-metadata.txt

      - name: Upload encrypted private backup
        if: ${{ always() && steps.backup.outputs.encrypted_file != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.backup.outputs.artifact_name }}
          path: |
            ${{ steps.backup.outputs.encrypted_file }}
            ${{ steps.backup.outputs.encrypted_file }}.sha256
            backup-metadata.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
