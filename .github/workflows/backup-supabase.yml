name: Backup Supabase

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/backup-supabase.yml
      - scripts/backup/**
      - RUNBOOK_BACKUPS.md
  push:
    branches:
      - main
    paths:
      - .github/workflows/backup-supabase.yml
      - scripts/backup/**
      - RUNBOOK_BACKUPS.md
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: programing-evo-backup-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate backup and restore path
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate workflow syntax
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7

      - name: Validate scripts
        run: |
          shellcheck scripts/backup/*.sh
          node --check scripts/backup/validate-db-url.mjs
          node --check scripts/backup/validate-db-url.test.mjs
          node scripts/backup/validate-db-url.test.mjs

      - name: Synthetic backup, encryption and restore test
        run: scripts/backup/test-backup-restore.sh

  backup:
    name: Encrypted production backup and isolated restore
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: programing-evo-production
    permissions:
      contents: write
    env:
      SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PRODUCTION_PROJECT_REF: ${{ secrets.SUPABASE_PRODUCTION_PROJECT_REF }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      BACKUP_REQUIRED_TABLES: >-
        public.published_weeks public.coach_sessions public.coach_messages
        public.coach_session_feedback
      BACKUP_REQUIRED_FUNCTIONS: >-
        save_published_week_draft_v2 publish_published_week_draft_v2
        save_and_publish_published_week_v2
      BACKUP_WEEK_TABLE: public.published_weeks
      BACKUP_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      BACKUP_POSTGRES_IMAGE: postgres:17-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate, encrypt and verify backup
        run: scripts/backup/run-backup.sh

      - name: Publish verified encrypted backup
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BACKUP_TAG }}
          name: ${{ env.BACKUP_TAG }}
          body: |
            Encrypted Supabase production backup.
            Restore verification: PASS.
            Source commit: ${{ github.sha }}.
            Workflow run: ${{ github.run_id }} attempt ${{ github.run_attempt }}.
            PostgreSQL client/restore image: ${{ env.BACKUP_POSTGRES_IMAGE }}.
          files: |
            ${{ env.BACKUP_FILE }}
            ${{ env.BACKUP_CHECKSUM_FILE }}
          make_latest: false
          overwrite_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
