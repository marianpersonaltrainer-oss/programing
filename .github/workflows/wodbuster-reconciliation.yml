name: WodBuster reconciliation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Sync mode
        required: true
        default: frequent
        type: choice
        options:
          - frequent
          - daily
  pull_request:
    types:
      - labeled
  schedule:
    - cron: '*/30 * * * *'
    - cron: '15 3 * * *'

concurrency:
  group: wodbuster-reconciliation-staging
  cancel-in-progress: false

jobs:
  sync:
    # Before merge, a same-repository PR can run the controlled live test only
    # when the explicit label is added. This avoids merging #16 merely to gain
    # access to workflow_dispatch, and keeps production untouched.
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-wodbuster-live'
    runs-on: ubuntu-latest
    environment: programing-evo-staging
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MC_ORG_ID: ${{ secrets.MC_ORG_ID }}
      WODBUSTER_DATA_ACCESS_KEY: ${{ secrets.WODBUSTER_DATA_ACCESS_KEY }}
      WODBUSTER_DATA_ATLETAS_URL: ${{ secrets.WODBUSTER_DATA_ATLETAS_URL }}
      WODBUSTER_DATA_CUANTO_ENTRENAN_URL: ${{ secrets.WODBUSTER_DATA_CUANTO_ENTRENAN_URL }}
      WODBUSTER_DATA_CUANTO_ENSENAN_URL: ${{ secrets.WODBUSTER_DATA_CUANTO_ENSENAN_URL }}
      WODBUSTER_DATA_AUTH_HEADER: API_ACCESS_KEY
      EVO_TIMEZONE: Europe/Madrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve sync mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=frequent" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "15 3 * * *" ]; then
            echo "value=daily" >> "$GITHUB_OUTPUT"
          else
            echo "value=frequent" >> "$GITHUB_OUTPUT"
          fi
      - name: Reconcile WodBuster into Nucleus staging
        run: npm run sync:wodbuster -- --mode=${{ steps.mode.outputs.value }}
